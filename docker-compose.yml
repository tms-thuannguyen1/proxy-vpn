services:
  vpn-proxy:
    build: .
    container_name: l2tp-proxy
    # Least privilege instead of `privileged: true`: NET_ADMIN for IPsec/ppp/
    # WireGuard interfaces and routes, /dev/ppp for the L2TP link
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/ppp
    sysctls:
      - net.ipv4.ip_forward=1
    security_opt:
      - no-new-privileges:true
    env_file: .env
    ports:
      - "127.0.0.1:1080:1080"
      # WireGuard bridge used by vpn-on to route the whole Mac through the VPN
      - "127.0.0.1:51820:51820/udp"
      # Local ports for PORT_FORWARDS (see .env.example)
      - "127.0.0.1:${FORWARD_PORTS:-41000-41009}:${FORWARD_PORTS:-41000-41009}"
    volumes:
      # WireGuard keys and the generated Mac client config (git-ignored)
      - ./data:/data
    restart: unless-stopped
